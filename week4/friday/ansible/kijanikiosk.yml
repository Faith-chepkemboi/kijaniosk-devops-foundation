---
- name: Configure KijaniKiosk servers
  hosts: kijanikiosk
  become: true

  tasks:
    # Phase 1: packages
    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 120
      tags: [packages]

    - name: Hold pinned packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ held_packages }}"
      tags: [packages]

    # Phase 2: service accounts
    - name: Create the shared group
      ansible.builtin.group:
        name: "{{ app_group }}"
        system: true
        state: present
      tags: [accounts]

    - name: Create service users
      ansible.builtin.user:
        name: "{{ item }}"
        system: true
        group: "{{ app_group }}"
        shell: "{{ service_shell }}"
        create_home: false
      loop: "{{ service_users }}"
      tags: [accounts]

    # Phase 3: directories and ACLs
    - name: Create the config directory
      ansible.builtin.file:
        path: "{{ config_dir }}"
        state: directory
        owner: "{{ config_dir_owner }}"
        group: "{{ app_group }}"
        mode: "{{ config_dir_mode }}"
      tags: [directories]

    - name: Create the shared logs directory
      ansible.builtin.file:
        path: "{{ logs_dir }}"
        state: directory
        owner: "{{ logs_dir_owner }}"
        group: "{{ app_group }}"
        mode: "{{ logs_dir_mode }}"
      tags: [directories]

    - name: Set access ACLs on the logs directory
      ansible.posix.acl:
        path: "{{ logs_dir }}"
        entity: "{{ item.user }}"
        etype: user
        permissions: "{{ item.perms }}"
        state: present
      loop: "{{ log_acl_access }}"
      tags: [directories]

    - name: Set default ACLs on the logs directory
      ansible.posix.acl:
        path: "{{ logs_dir }}"
        default: true
        entity: "{{ item.user }}"
        etype: user
        permissions: "{{ item.perms }}"
        state: present
      loop: "{{ log_acl_default }}"
      tags: [directories]

    # Phase 4: systemd units
    - name: Write the service environment file
      ansible.builtin.template:
        src: service.env.j2
        dest: "{{ service_env_file }}"
        owner: root
        group: "{{ app_group }}"
        mode: "0640"
      when: service_env_file is defined
      notify: Restart service
      tags: [systemd]

    - name: Write the service unit file
      ansible.builtin.template:
        src: service.j2
        dest: "/etc/systemd/system/{{ service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart service
      tags: [systemd]

    - name: Apply pending systemd changes before starting
      ansible.builtin.meta: flush_handlers
      tags: [systemd]

    - name: Enable and start the service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        state: started
      tags: [systemd]


    # Phase 5: firewall (SSH is allowed before the firewall is switched on)
    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp
        comment: "SSH administration access"
      tags: [firewall]

    - name: Allow application ports
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: tcp
        comment: "{{ item.comment }}"
      loop: "{{ firewall_ports }}"
      tags: [firewall]

    - name: Deny incoming traffic by default
      community.general.ufw:
        default: deny
        direction: incoming
      tags: [firewall]

    - name: Allow outgoing traffic by default
      community.general.ufw:
        default: allow
        direction: outgoing
      tags: [firewall]

    - name: Enable the firewall
      community.general.ufw:
        state: enabled
      tags: [firewall]

    # Phase 6: journal persistence
    - name: Create the persistent journal directory
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: "2755"
      tags: [journal]

    - name: Create the journald drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [journal]

    - name: Write the journald settings
      ansible.builtin.template:
        src: journald.conf.j2
        dest: /etc/systemd/journald.conf.d/99-kijanikiosk.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart journald
      tags: [journal]

    # Phase 7: log rotation
    - name: Write the logrotate policy
      ansible.builtin.template:
        src: logrotate.j2
        dest: /etc/logrotate.d/kijanikiosk
        owner: root
        group: root
        mode: "0644"
        validate: "logrotate --debug %s"
      tags: [logrotate]

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted

    - name: Restart journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
